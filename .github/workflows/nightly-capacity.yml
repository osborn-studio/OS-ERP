name: Nightly capacity

# Z10: nightly synthetic-database capacity baseline on a GitHub-hosted runner (pre-revenue phase, user decision 2026-10-22).
# Flow: scripts/synth-pipeline.mjs (generate -> backup -> restore drill -> explain-audit -> bench-api read profile)
#       -> bench-api write profile on a copy of the pipeline's bench copy -> scripts/capacity-summary.mjs (allowlisted summary).
# Numbers are TREND INDICATORS ONLY: shared hosted VM, synthetic data, single run. They are not target-host (dmserver)
# results, not a capacity commitment, and not release or production acceptance.
# The job fails only when: a pipeline step fails, explain-audit reports violations, or a bench profile has errors > 0
# (write profile: or its integrity check fails). Latency never fails the job.
# Only the allowlisted capacity-summary.json is uploaded; raw reports, databases, backups and logs never are.
# This workflow has not been executed on GitHub yet; the first scheduled or manual run is its first real test.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fts_benchmark_only:
        description: Run isolated FTS write/toggle benchmarks instead of capacity
        type: boolean
        default: false
      validation_sha:
        description: Exact 40-character source SHA required for FTS benchmarks
        type: string
        default: ''
      scale:
        description: Synthetic database scale (small = 2k SKU, medium = 20k SKU / 30k docs, large = 20k SKU / 50k docs, large-ci = AB11 100k SKU / 1M txns with a 240 min generation budget)
        required: false
        default: medium
        type: choice
        options:
          - small
          - medium
          - large
          - large-ci
      # AA11: optional, default off. Scheduled runs never set it, so they never run the rehearsal.
      rehearsal:
        description: Also run the upgrade rehearsal (replay migrations 059+ on a copy of the synthetic database, timings in the log only)
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      # AB5: optional string, default empty (= off). Only used together with rehearsal=true.
      snapshot_upto:
        description: With rehearsal=true, rehearse a genuinely old-structure database instead of the pipeline database - a migration number N (for example 58) builds a version-N backup set with synthetic data at the chosen scale, then replays N+1 onward
        required: false
        default: ''
        type: string
      # AC5: optional string, default empty (= off). Set to the single word "integrity-check" to run the audit FTS integrity check on a copy of the synthetic database.
      audit_fts:
        description: Optional audit FTS maintenance check on a copy of the synthetic database - enter integrity-check (anything else is rejected; empty = off)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.fts_benchmark_only && 'fts-write-benchmark' || 'nightly-capacity' }}
  cancel-in-progress: false

jobs:
  capacity:
    if: ${{ !inputs.fts_benchmark_only }}
    name: Synthetic capacity baseline (hosted, trend only)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scale == 'large-ci' && 355 || 60 }}
    env:
      CI: 'true'
      HOST: 127.0.0.1
      GML_DB: ''
      SCALE_INPUT: ${{ inputs.scale }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      # The scale comes in through an environment variable and is matched against a fixed list; it is never
      # interpolated into a script. Scheduled runs have no input and use medium.
      - name: Prepare scale and throwaway admin password
        run: |
          set -euo pipefail
          scale="${SCALE_INPUT:-medium}"
          case "$scale" in
            small)  args='--skus 2000 --docs 3000 --txns 15000' ;;
            medium) args='--skus 20000 --docs 30000 --txns 150000' ;;
            large)  args='--skus 20000 --docs 50000 --txns 250000' ;;
            large-ci) args='--profile large-ci --time-budget 240' ;; # AB11: stops early (partial:true, still green) when the budget or disk guard trips
            *) echo '::error::unknown scale'; exit 1 ;;
          esac
          pw="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$pw"
          {
            echo "CAP_SCALE=$scale"
            echo "CAP_ARGS=$args"
            echo "GML_PIPELINE_ADMIN_PASSWORD=$pw"
            echo "CAP_RUN=$RUNNER_TEMP/capacity-run"
            echo "CAP_REPORTS=$RUNNER_TEMP/capacity-reports"
            echo "CAP_SUMMARY=$RUNNER_TEMP/capacity-summary"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/capacity-reports" "$RUNNER_TEMP/capacity-summary"
      # Exit 1 = a pipeline step failed (explain-audit findings do NOT fail this step; the summary step judges them).
      - name: Synthetic pipeline (generate, backup, restore drill, explain-audit, bench read profile)
        id: pipeline
        continue-on-error: true
        run: |
          set -uo pipefail
          # stdout and stderr go to a disposable file; only fixed-format timing lines are echoed (no paths, no error text).
          # shellcheck disable=SC2086
          node scripts/synth-pipeline.mjs --dir "$CAP_RUN" --keep $CAP_ARGS --iterations 100 --concurrency 4 --out "$CAP_REPORTS/pipeline-report.json" > "$CAP_REPORTS/pipeline.log" 2>&1
          rc=$?
          grep -E '^\[pipeline\] [a-z_]+: exit [0-9a-z]+ in [0-9.]+s$' "$CAP_REPORTS/pipeline.log" || true
          [ "$rc" -eq 0 ] || echo "::error::pipeline exited with code $rc (raw output withheld)"
          exit "$rc"
      # AB11 (large-ci only): honest report straight from the raw pipeline report. Prints only numbers and fixed names (no paths, no error text).
      - name: Large-ci report (partial flag, reached scale, p95 table, explain-audit violations)
        if: inputs.scale == 'large-ci' && always()
        continue-on-error: true
        run: |
          node -e "const fs=require('fs');let r;try{r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'))}catch{console.log('large-ci: no pipeline report');process.exit(0)}const n=(v)=>(typeof v==='number'&&Number.isFinite(v)?v:'?');const w=(v)=>String(v??'').replace(/[^A-Za-z0-9_.\/-]/g,'?').slice(0,64);const x=r.reached||{};console.log('large-ci partial='+(r.partial===true)+' reason='+w(r.partial_reason)+' skus='+n(x.skus)+' txns='+n(x.txns)+'/'+n(x.txns_target)+' docs='+n(x.docs)+'/'+n(x.docs_target));const ea=r.steps&&r.steps.explain_audit;console.log('large-ci explain_audit violations='+n(ea&&ea.violations));for(const e of ((r.steps&&r.steps.bench_api&&r.steps.bench_api.endpoints)||[]).slice(0,40))console.log('large-ci p95 '+w(e.name)+' p50='+n(e.p50)+' p95='+n(e.p95)+' p99='+n(e.p99)+' errors='+n(e.errors))" "$CAP_REPORTS/pipeline-report.json"
      # The write profile mutates its database, so it runs on a fresh copy of the pipeline's (already disposable, test-classified) bench copy.
      - name: Bench write profile (on a copy of the bench database)
        id: bench_write
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        env:
          GML_RUNTIME_MODE: test
          GML_BENCH_USER: synthadmin
        run: |
          set -uo pipefail
          cp -R "$CAP_RUN/bench-copy" "$CAP_RUN/write-copy" || exit 1
          GML_DATA_DIR="$CAP_RUN/write-copy" GML_BENCH_PASSWORD="$GML_PIPELINE_ADMIN_PASSWORD" \
            node scripts/bench-api.mjs --profile=write --iterations 50 --concurrency 4 --max-error-rate 0 --out "$CAP_REPORTS/bench-write.json" > "$CAP_REPORTS/bench-write.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || echo "::error::bench write profile exited with code $rc (raw output withheld)"
          exit "$rc"
      # AA11 (optional, default off): replay migrations > 058 one by one on a copy of the pipeline's synthetic database and print
      # per-migration timings (fixed-format lines only, no paths). It never changes the gate: a failure here is a warning, not a red job.
      # AB5: with snapshot_upto=N the step first builds a version-N backup set (scripts/schema-snapshot.mjs: schema.sql + migrations <= N,
      # synthetic data at the chosen scale; large uses medium) and rehearses that instead; the value is validated as 1-3 digits and never interpolated.
      - name: Upgrade rehearsal (optional, off by default)
        id: rehearsal
        if: inputs.rehearsal == 'true' && steps.pipeline.outcome == 'success'
        continue-on-error: true
        env:
          SNAPSHOT_UPTO_INPUT: ${{ inputs.snapshot_upto }}
        run: |
          set -uo pipefail
          snap="${SNAPSHOT_UPTO_INPUT:-}"
          if [ -z "$snap" ]; then
            node scripts/upgrade-rehearsal.mjs --from=58 --synth-dir="$CAP_RUN/data" --target-dir="$CAP_RUN/upgrade-rehearsal" > "$CAP_REPORTS/rehearsal.log" 2>&1
            rc=$?
          else
            case "$snap" in
              [0-9]|[0-9][0-9]|[0-9][0-9][0-9]) ;;
              *) echo '::error::snapshot_upto must be a migration number'; exit 1 ;;
            esac
            case "$CAP_SCALE" in small) profile=small ;; *) profile=medium ;; esac
            node scripts/schema-snapshot.mjs --upto="$snap" --synth="$profile" --out="$CAP_RUN/snapshot" > "$CAP_REPORTS/snapshot.log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              node scripts/upgrade-rehearsal.mjs --from="$snap" --backup-dir="$CAP_RUN/snapshot/data/backups" --target-dir="$CAP_RUN/upgrade-rehearsal" > "$CAP_REPORTS/rehearsal.log" 2>&1
              rc=$?
            else
              echo "::warning::schema snapshot exited with code $rc (raw output withheld)"
              : > "$CAP_REPORTS/rehearsal.log"
            fi
          fi
          grep -E '^    [0-9]{3}_[A-Za-z0-9_.-]+ +(ok|failed|unexpected|pending) ' "$CAP_REPORTS/rehearsal.log" || true
          [ "$rc" -eq 0 ] || echo "::warning::upgrade rehearsal exited with code $rc (raw output withheld)"
          exit "$rc"
      # AC5 (optional, default off): FTS5 integrity-check of audit_logs_fts on a throwaway copy of the pipeline's synthetic database.
      # The input is matched against one fixed word and never interpolated into a script. Never changes the gate: a failure is a warning.
      # Prints one fixed-format line (numbers and fixed words only; no paths, no error text).
      - name: Audit FTS integrity check (optional, off by default)
        id: audit_fts
        if: inputs.audit_fts != '' && steps.pipeline.outcome == 'success'
        continue-on-error: true
        env:
          AUDIT_FTS_INPUT: ${{ inputs.audit_fts }}
        run: |
          set -uo pipefail
          [ "$AUDIT_FTS_INPUT" = integrity-check ] || { echo '::error::audit_fts accepts only: integrity-check'; exit 1; }
          cp -R "$CAP_RUN/data" "$CAP_RUN/audit-fts-copy" || exit 1
          node scripts/audit-fts-maintain.mjs --data-dir "$CAP_RUN/audit-fts-copy" --industry cosmetic --integrity-check --out "$CAP_REPORTS/audit-fts.json" > "$CAP_REPORTS/audit-fts.log" 2>&1
          rc=$?
          grep -oE '^audit-fts-maintain integrity-check (ok|FAILED) status=[a-z]+ industry=[a-z]+ rows=[0-9]+ elapsed_ms=[-0-9.]+' "$CAP_REPORTS/audit-fts.log" || true
          [ "$rc" -eq 0 ] || echo "::warning::audit FTS integrity check exited with code $rc (raw output withheld)"
          exit "$rc"
      # AH3 (ADR-0044 supplement 7): compares the committed docs/implementation/explain-plans.large.json with the plans on the pipeline's
      # synthetic database. The pipeline database has no OMS orders, so --fill-oms tops up an isolated online-backup copy of it with 200k
      # (the original is only read; the copy lives in the runner temp dir and is removed by the tool); the tool refuses a database that
      # is not large enough, so an empty OMS table can never produce a green result. Skipped for large-ci (the extra copy would not fit
      # the runner disk). Plan fingerprints do not depend on row counts; the row-count thresholds do. It never changes the gate: a failure
      # is a warning. Stdout and stderr go to a disposable log; only fixed-format lines with numbers are echoed (no paths, no statement text).
      - name: Large-database plan snapshot (explain-audit --scale large --compare on the pipeline database)
        id: explain_large
        if: inputs.scale != 'large-ci' && steps.pipeline.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          node scripts/explain-audit.mjs --scale large --compare docs/implementation/explain-plans.large.json --large-dir "$CAP_RUN/data" --fill-oms 200000 > "$CAP_REPORTS/explain-large.log" 2>&1
          rc=$?
          grep -E '^explain-audit \(大库\): [0-9]+ 条语句, 迁移 [0-9a-z_]+, 阈值 [0-9]+ 行; 裸 SCAN [0-9]+ \(违规 [0-9]+, 豁免 [0-9]+, 小表 [0-9]+\), 索引全扫 [0-9]+$|^explain-audit \(大库\): 计划指纹比较 [0-9]+ 条, 漂移 [0-9]+ \(白名单 [0-9]+\), 过期白名单 [0-9]+$' "$CAP_REPORTS/explain-large.log" || true
          [ "$rc" -eq 0 ] || echo "::warning::large-database plan snapshot exited with code $rc (raw output withheld)"
          exit "$rc"
      - name: Reduce reports to the allowlisted summary (printed to the log)
        id: summary
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/capacity-summary.mjs --pipeline "$CAP_REPORTS/pipeline-report.json" --write "$CAP_REPORTS/bench-write.json" --out "$CAP_SUMMARY/capacity-summary.json" --scale "$CAP_SCALE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: os-erp-capacity-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-summary/capacity-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove databases, backups and raw reports
        if: always()
        run: rm -rf "$CAP_RUN" "$CAP_REPORTS"
      # The gate: red only for a failed pipeline step, explain-audit violations or bench errors (all judged by the summary step).
      - name: Gate
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          WRITE_OUTCOME: ${{ steps.bench_write.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          echo "pipeline=$PIPELINE_OUTCOME bench_write=$WRITE_OUTCOME summary=$SUMMARY_OUTCOME"
          if [ "$PIPELINE_OUTCOME" = failure ] || [ "$WRITE_OUTCOME" = failure ] || [ "$SUMMARY_OUTCOME" != success ]; then
            echo '::error::nightly capacity failed: see the summary step for the failure codes'
            exit 1
          fi

  fts-write-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.fts_benchmark_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VALIDATION_SHA: ${{ inputs.validation_sha }}
    steps:
      - name: Require an exact source commit
        run: |
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.validation_sha }}
          persist-credentials: false
      - name: Verify checked-out source
        run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      - name: Paced writes and large audit index integrity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fts-validation"
          node scripts/bench-audit-toggle-under-write.mjs --rounds 20 --rate 200 --seed-rows 20000 --out "$RUNNER_TEMP/fts-validation/steady.json" > "$RUNNER_TEMP/fts-steady.log" 2>&1
          node scripts/bench-audit-toggle-under-write.mjs --mode burst --burst-size 200 --burst-every-ms 0 --rounds 5 --seed-rows 500000 --out "$RUNNER_TEMP/fts-validation/large.json" > "$RUNNER_TEMP/fts-large.log" 2>&1
      - name: Validate and sanitize evidence
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dir = process.env.RUNNER_TEMP + '/fts-validation';
          const summaries = ['steady', 'large'].map(name => {
            const r = JSON.parse(fs.readFileSync(dir + '/' + name + '.json', 'utf8'));
            if (r.ok !== true || ['toggles_ok','chain_ok','no_lost_rows','fts_matches_rows'].some(k => r.verify?.[k] !== true) || !Number.isSafeInteger(r.writer?.acked) || r.writer.acked <= 0 || r.writer.attempted !== r.writer.acked) throw new Error('FTS benchmark integrity gate failed');
            const clean = v => typeof v === 'number' || typeof v === 'boolean' || v === null ? v : Array.isArray(v) ? v.map(clean) : typeof v === 'object' ? Object.fromEntries(Object.entries(v).filter(([k]) => /^[A-Za-z0-9_]{1,64}$/.test(k)).map(([k,x]) => [k,clean(x)])) : ['ok','steady','burst','linux'].includes(v) ? v : '[omitted]';
            const walls = r.rounds.map(x => x.enable.wall_ms).sort((a,b) => a-b);
            if (!walls.length || walls.some(x => !Number.isFinite(x))) throw new Error('Missing enable wall timings');
            return {name, enable_wall_p95_ms: walls[Math.ceil(walls.length * 0.95)-1], report: clean(r)};
          });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/fts-evidence.json', JSON.stringify({source_sha:process.env.VALIDATION_SHA, scope:'synthetic hosted Linux; not production capacity', summaries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fts-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fts-evidence.json
          if-no-files-found: error
          retention-days: 14
