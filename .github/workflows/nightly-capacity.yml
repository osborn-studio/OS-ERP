name: Nightly capacity

# Z10: nightly synthetic-database capacity baseline on a GitHub-hosted runner (pre-revenue phase, user decision 2026-10-22).
# Flow: scripts/synth-pipeline.mjs (generate -> backup -> restore drill -> explain-audit -> bench-api read profile)
#       -> bench-api write profile on a copy of the pipeline's bench copy -> scripts/capacity-summary.mjs (allowlisted summary).
# Numbers are TREND INDICATORS ONLY: shared hosted VM, synthetic data, single run. They are not target-host (dmserver)
# results, not a capacity commitment, and not release or production acceptance.
# The job fails only when: a pipeline step fails, explain-audit reports violations, or a bench profile has errors > 0
# (write profile: or its integrity check fails). Latency never fails the job.
# Only the allowlisted capacity-summary.json is uploaded; raw reports, databases, backups and logs never are.
# This workflow has not been executed on GitHub yet; the first scheduled or manual run is its first real test.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: Synthetic database scale (small = 2k SKU, medium = 20k SKU / 30k docs, large = 20k SKU / 50k docs)
        required: false
        default: medium
        type: choice
        options:
          - small
          - medium
          - large

permissions:
  contents: read

concurrency:
  group: nightly-capacity
  cancel-in-progress: false

jobs:
  capacity:
    name: Synthetic capacity baseline (hosted, trend only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      HOST: 127.0.0.1
      GML_DB: ''
      SCALE_INPUT: ${{ inputs.scale }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      # The scale comes in through an environment variable and is matched against a fixed list; it is never
      # interpolated into a script. Scheduled runs have no input and use medium.
      - name: Prepare scale and throwaway admin password
        run: |
          set -euo pipefail
          scale="${SCALE_INPUT:-medium}"
          case "$scale" in
            small)  args='--skus 2000 --docs 3000 --txns 15000' ;;
            medium) args='--skus 20000 --docs 30000 --txns 150000' ;;
            large)  args='--skus 20000 --docs 50000 --txns 250000' ;;
            *) echo '::error::unknown scale'; exit 1 ;;
          esac
          pw="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$pw"
          {
            echo "CAP_SCALE=$scale"
            echo "CAP_ARGS=$args"
            echo "GML_PIPELINE_ADMIN_PASSWORD=$pw"
            echo "CAP_RUN=$RUNNER_TEMP/capacity-run"
            echo "CAP_REPORTS=$RUNNER_TEMP/capacity-reports"
            echo "CAP_SUMMARY=$RUNNER_TEMP/capacity-summary"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/capacity-reports" "$RUNNER_TEMP/capacity-summary"
      # Exit 1 = a pipeline step failed (explain-audit findings do NOT fail this step; the summary step judges them).
      - name: Synthetic pipeline (generate, backup, restore drill, explain-audit, bench read profile)
        id: pipeline
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/synth-pipeline.mjs --dir "$CAP_RUN" --keep $CAP_ARGS --iterations 100 --concurrency 4 --out "$CAP_REPORTS/pipeline-report.json" > /dev/null
      # The write profile mutates its database, so it runs on a fresh copy of the pipeline's (already disposable, test-classified) bench copy.
      - name: Bench write profile (on a copy of the bench database)
        id: bench_write
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        env:
          GML_RUNTIME_MODE: test
          GML_BENCH_USER: synthadmin
        run: |
          set -euo pipefail
          cp -R "$CAP_RUN/bench-copy" "$CAP_RUN/write-copy"
          GML_DATA_DIR="$CAP_RUN/write-copy" GML_BENCH_PASSWORD="$GML_PIPELINE_ADMIN_PASSWORD" \
            node scripts/bench-api.mjs --profile=write --iterations 50 --concurrency 4 --max-error-rate 0 --out "$CAP_REPORTS/bench-write.json" > /dev/null
      - name: Reduce reports to the allowlisted summary (printed to the log)
        id: summary
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/capacity-summary.mjs --pipeline "$CAP_REPORTS/pipeline-report.json" --write "$CAP_REPORTS/bench-write.json" --out "$CAP_SUMMARY/capacity-summary.json" --scale "$CAP_SCALE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: os-erp-capacity-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-summary/capacity-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove databases, backups and raw reports
        if: always()
        run: rm -rf "$CAP_RUN" "$CAP_REPORTS"
      # The gate: red only for a failed pipeline step, explain-audit violations or bench errors (all judged by the summary step).
      - name: Gate
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          WRITE_OUTCOME: ${{ steps.bench_write.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          echo "pipeline=$PIPELINE_OUTCOME bench_write=$WRITE_OUTCOME summary=$SUMMARY_OUTCOME"
          if [ "$PIPELINE_OUTCOME" = failure ] || [ "$WRITE_OUTCOME" = failure ] || [ "$SUMMARY_OUTCOME" != success ]; then
            echo '::error::nightly capacity failed: see the summary step for the failure codes'
            exit 1
          fi
