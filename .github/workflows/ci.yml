name: CI

# GitHub-hosted validation for the public, pre-revenue phase (user decision 2026-10-22).
# Once paid service starts, validation moves to the dedicated Linux host (see linux-validation.yml).
# Hosted results gate development merges; they are not release-package or production acceptance.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rounds:
        description: Isolated regression rounds (1 for quick, 3 for candidate validation)
        required: false
        default: '3'
        type: string

permissions:
  contents: read

# Superseded PR/main runs are cancelled; dispatch and tag runs (which may start the candidate job) are never cancelled by a newer run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

env:
  CI: 'true'
  HOST: 127.0.0.1
  GML_RUNTIME_MODE: test
  GML_DB: ''

jobs:
  checks:
    name: Typecheck, build, focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      # Runtime-dependency audit gate (AC10): every high/critical advisory from `npm audit --omit=dev` must be listed in
      # docs/security/audit-allowlist.json with reason and a future expiry; an expired or unlisted finding fails. Needs network.
      - name: Dependency audit gate (runtime, allowlist with expiry)
        run: node scripts/check-audit-allowlist.mjs
      # Notices are generated from package-lock.json plus the LICENSE/NOTICE files in the npm ci tree; drift fails.
      # Scope: runtime dependencies only. This checks that the file is current, not that licenses are legally cleared.
      - name: Third-party notices are current; runtime SBOM generates
        run: |
          set -euo pipefail
          node scripts/gen-third-party-notices.mjs
          git diff --exit-code -- THIRD_PARTY_NOTICES.md || { echo '::error::THIRD_PARTY_NOTICES.md is stale; run npm run notices and commit'; exit 1; }
          node scripts/gen-sbom.mjs
      # CHANGELOG.md is generated from docs/implementation/ADR-*.md (Y9); drift fails. It restates ADR decisions, not acceptance.
      - name: Changelog is current
        run: |
          set -euo pipefail
          node scripts/gen-changelog.mjs --check
      # docs/CODEMAPS/* and docs/implementation/ADR-INDEX.md are generated by a static scan (Z12); drift fails.
      - name: Codemaps are current
        run: |
          set -euo pipefail
          node scripts/gen-codemap.mjs --check
      # AD2: docs/operations/role-matrix.md is generated from the permission dictionary, DOC_VIEW_PERMS, DOC_SCOPE_RESOLVERS and hq-roles.js; drift fails.
      - name: Role matrix is current
        run: node scripts/gen-role-matrix.mjs --check
      # AC5: re-runs only the audit view tests with the FTS query path switched off (GML_AUDIT_FTS=0), so the no-FTS5 fallback is exercised for real.
      - name: Audit view tests without FTS (GML_AUDIT_FTS=0)
        run: GML_AUDIT_FTS=0 node --test --test-concurrency=1 tests/audit-logs-view.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vite build
        run: npm run build
      - name: Focused tests (tests/*.test.mjs)
        run: |
          set -euo pipefail
          export GML_JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          npm run test:focused

  audit-no-fts5:
    # AD4 (ADR-0054): a REAL SQLite build without FTS5. better-sqlite3 enables FTS5 only through the SQLITE_ENABLE_FTS5 define in
    # deps/defines.gypi (there is no OMIT switch to pass; FTS5 is off unless enabled), so this job deletes that one define from the
    # installed module and rebuilds it from source (about 40 s locally). It then proves the build has no fts5 module and runs the audit
    # view and maintenance tests, where FTS-dependent cases skip with a stated reason and the no-FTS5 cases run for real.
    name: Audit search on a SQLite build without FTS5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies without native build hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild better-sqlite3 from source without SQLITE_ENABLE_FTS5
        run: |
          set -euo pipefail
          sed -i "/'SQLITE_ENABLE_FTS5',/d" node_modules/better-sqlite3/deps/defines.gypi
          if grep -q SQLITE_ENABLE_FTS5 node_modules/better-sqlite3/deps/defines.gypi; then echo '::error::could not remove SQLITE_ENABLE_FTS5'; exit 1; fi
          npm rebuild better-sqlite3 --build-from-source --no-audit --no-fund
      - name: Prove the build has no FTS5
        run: |
          node --input-type=module -e "
          import Database from 'better-sqlite3'
          const db = new Database(':memory:')
          const opts = db.pragma('compile_options').map((r) => r.compile_options)
          if (opts.includes('ENABLE_FTS5')) { console.error('FTS5 is still compiled in'); process.exit(1) }
          try { db.exec('CREATE VIRTUAL TABLE t USING fts5(x)'); console.error('fts5 table could be created'); process.exit(1) } catch { console.log('confirmed: no FTS5 in this SQLite build') }
          "
      - name: Audit view and FTS maintenance tests (no-FTS5 build)
        run: node --test --test-concurrency=1 tests/audit-logs-view.test.mjs tests/audit-fts-maintain.test.mjs

  docker:
    # Builds the ADR-0012 runtime image for linux/amd64 (no registry, no push, no login) and runs
    # scripts/docker-smoke.mjs against it: startup gates (missing / public-default secret are refused),
    # hardened run (read-only root, cap_drop ALL, no-new-privileges, named /data volume, loopback port),
    # /api/meta/health version + build_sha, /mcp 503 in production, uid 10001, /app not writable.
    # Passing here is container-contract evidence for this commit; it is not production acceptance.
    name: Docker image build and smoke (linux/amd64)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: '1'
      IMAGE: os-erp:ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      # The smoke script uses Node built-ins only (child_process, net, fetch); no npm install here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Build runtime image (linux/amd64, build SHA injected, not pushed)
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg "GML_BUILD_SHA=${GITHUB_SHA}" \
            --tag "$IMAGE" \
            .
          docker image inspect --format 'image={{.Id}} arch={{.Architecture}} user={{.Config.User}} size_bytes={{.Size}}' "$IMAGE"
      - name: Smoke (scripts/docker-smoke.mjs; prints allowlisted lines only)
        run: node scripts/docker-smoke.mjs --image "$IMAGE" --expect-sha "$GITHUB_SHA"
      - name: Alert rules (promtool check rules, prom/prometheus v3.5.0 pinned by digest)
        run: docker run --rm --network none --entrypoint promtool -v "$PWD:/w:ro" -w /w prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check rules docs/operations/alerts/*.yml

  browser:
    # Real-browser scenarios (tests/browser/*.mjs, driven by scripts/browser-ci.mjs) on Linux Chromium.
    # Chromium comes from the lockfile-pinned playwright devDependency (1.64.0, integrity in package-lock.json),
    # downloaded by `playwright install`; the driver starts server/index.js in test mode on a random loopback port with a
    # fresh random JWT secret and a temp GML_DATA_DIR (demo seed), then runs the scenarios.
    # Only the allowlisted summary.json, evidence-*.json and failure screenshots are uploaded; raw logs never are.
    # Passing is source-level browser evidence for this commit; it is not release-package or production acceptance.
    name: Browser scenarios (Linux Chromium)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      - name: Install Chromium and system libraries (playwright from the lockfile)
        run: |
          set -euo pipefail
          npx --no-install playwright --version
          npx --no-install playwright install --with-deps chromium
      - name: Vite build
        run: npm run build
      - name: Run browser scenarios (prints PASS lines and filtered failure tails only)
        run: node scripts/browser-ci.mjs --out=artifacts/browser-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: os-erp-browser-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-ci/summary.json
            artifacts/browser-ci/evidence-*.json
            artifacts/browser-ci/screenshots/failure-*.png
          if-no-files-found: error
          retention-days: 14

  regression:
    name: Isolated regression (cosmetic, food)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GML_VERIFY_PLATFORM: linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare isolated Python verifier (openpyxl pinned by requirements-test.txt)
        run: |
          set -euo pipefail
          # runner.temp is not available in job-level env; export the raw-output root here.
          echo "RAW_ROOT=$RUNNER_TEMP/os-erp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/xlsx-venv"
          "$RUNNER_TEMP/xlsx-venv/bin/pip" install --no-cache-dir --disable-pip-version-check -r requirements-test.txt
          echo "GML_PYTHON=$RUNNER_TEMP/xlsx-venv/bin/python" >> "$GITHUB_ENV"
          command -v unzip
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      - name: Run isolated regression rounds
        id: regression
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RAW_ROOT"
          rounds='${{ github.event_name == 'workflow_dispatch' && inputs.rounds || '1' }}'
          export GML_JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          # Raw logs are not streamed: inherited tests can print test credentials.
          node scripts/regress-isolated.mjs --rounds="$rounds" --industries=cosmetic,food --output="$RAW_ROOT/regression" > "$RAW_ROOT/runner.log" 2>&1
      - name: Summarize (allowlisted lines only)
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RAW_ROOT/runner.log" ]; then
            grep -E '^(█ 第|  [✓✗] |  第 [0-9]+ 轮|  断言累计|回归失败|  明细：|全量回归通过)' "$RAW_ROOT/runner.log" || true
            if [ "${{ steps.regression.outcome }}" != "success" ]; then
              echo '::group::Failure diagnostics (filtered, long opaque strings redacted)'
              # Only lines that carry a failure signal; any 32+ char opaque string is masked so test credentials never print.
              grep -E '失败|FAIL|Error|error|✗|退出码|assert|Timeout|EADDRINUSE|ECONNREFUSED|not ok|location:|expected|actual|Subtest|输出尾部|not ok 用例' "$RAW_ROOT/runner.log" \
                | grep -vE '^  ✓' \
                | sed -E 's/[A-Za-z0-9_.-]{32,}/[REDACTED]/g' \
                | tail -200 || true
              echo '::endgroup::'
              echo '::group::node:test tail (last 120 lines of the failed check output, redacted)'
              # The node:test runner can die without a TAP summary (uncaught error in a hook); its raw tail names the file and stack.
              awk '/✗ node:test/{p=1} p' "$RAW_ROOT/runner.log" | head -160 | sed -E 's/[A-Za-z0-9_.-]{32,}/[REDACTED]/g' | tail -120 || true
              echo '::endgroup::'
            fi
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs'
          let manifest = {}
          try { manifest = JSON.parse(readFileSync(`${process.env.RAW_ROOT}/regression/manifest.json`, 'utf8')) } catch {}
          const summary = {
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            source_head: /^[0-9a-f]{40}$/.test(manifest.source_head || '') ? manifest.source_head : null,
            platform: process.platform,
            node: process.version,
            python: manifest.python?.version ?? null,
            openpyxl: manifest.python?.openpyxl ?? null,
            rounds: manifest.rounds ?? null,
            industries: manifest.industries ?? null,
            result: ['passed', 'failed'].includes(manifest.result) ? manifest.result : 'unavailable',
            error: manifest.error ?? null,
            completed_at: manifest.completed_at ?? null,
            evidence_scope: 'GitHub-hosted isolated source regression; not release-package acceptance or production readiness'
          }
          mkdirSync('artifacts/ci-summary', { recursive: true })
          writeFileSync('artifacts/ci-summary/summary.json', JSON.stringify(summary, null, 2) + '\n')
          console.log(JSON.stringify(summary, null, 2))
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: os-erp-ci-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-summary/summary.json
          if-no-files-found: error
          retention-days: 14

  # AD8 STOPGAP: nightly-capacity.yml is not on main yet (PR #7/#8 unmerged), so a workflow_dispatch cannot reach it. This job runs the
  # same synthetic pipeline at medium scale on a hosted runner, manual dispatch only (never push / pull_request). Remove it once
  # nightly-capacity.yml is on main. Numbers are trend indicators on a shared VM with synthetic data: not dmserver, not a capacity
  # commitment, not acceptance. Generation is time-boxed (--time-budget 20); the job is capped at 30 minutes; only the allowlisted
  # capacity-summary.json is uploaded (raw reports, databases and logs never are).
  capacity-smoke:
    name: Capacity smoke (manual, medium, hosted, trend only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
          pw="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$pw"
          # runner.temp is not available in job-level env; export the paths here.
          {
            echo "GML_PIPELINE_ADMIN_PASSWORD=$pw"
            echo "CAP_RUN=$RUNNER_TEMP/capacity-run"
            echo "CAP_REPORTS=$RUNNER_TEMP/capacity-reports"
            echo "CAP_SUMMARY=$RUNNER_TEMP/capacity-summary"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/capacity-reports" "$RUNNER_TEMP/capacity-summary"
      - name: Synthetic pipeline (medium, 20 min generation budget)
        id: pipeline
        continue-on-error: true
        env:
          HOST: 127.0.0.1
          GML_DB: ''
        run: |
          set -uo pipefail
          node scripts/synth-pipeline.mjs --dir "$CAP_RUN" --keep --skus 20000 --docs 30000 --txns 150000 --time-budget 20 --iterations 100 --concurrency 4 --out "$CAP_REPORTS/pipeline-report.json" > "$CAP_REPORTS/pipeline.log" 2>&1
          rc=$?
          grep -E '^\[pipeline\] [a-z_]+: exit [0-9a-z]+ in [0-9.]+s$' "$CAP_REPORTS/pipeline.log" || true
          [ "$rc" -eq 0 ] || echo "::error::pipeline exited with code $rc (raw output withheld)"
          exit "$rc"
      - name: Bench write profile (on a copy of the bench database)
        id: bench_write
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        env:
          HOST: 127.0.0.1
          GML_RUNTIME_MODE: test
          GML_BENCH_USER: synthadmin
        run: |
          set -uo pipefail
          cp -R "$CAP_RUN/bench-copy" "$CAP_RUN/write-copy" || exit 1
          GML_DATA_DIR="$CAP_RUN/write-copy" GML_BENCH_PASSWORD="$GML_PIPELINE_ADMIN_PASSWORD" \
            node scripts/bench-api.mjs --profile=write --iterations 50 --concurrency 4 --max-error-rate 0 --out "$CAP_REPORTS/bench-write.json" > "$CAP_REPORTS/bench-write.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || echo "::error::bench write profile exited with code $rc (raw output withheld)"
          exit "$rc"
      - name: Reduce reports to the allowlisted summary (printed to the log)
        id: summary
        if: always()
        run: |
          set -euo pipefail
          node scripts/capacity-summary.mjs --pipeline "$CAP_REPORTS/pipeline-report.json" --write "$CAP_REPORTS/bench-write.json" --out "$CAP_SUMMARY/capacity-summary.json" --scale medium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: os-erp-capacity-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-summary/capacity-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove databases, backups and raw reports
        if: always()
        run: rm -rf "$CAP_RUN" "$CAP_REPORTS"

  candidate:
    # AD10: unsigned release candidate built on a hosted runner. Runs ONLY for workflow_dispatch and pushes of v* tags
    # (never for pull requests or pushes to main). It builds RC-<version>-<sha>.zip + EVIDENCE.json with the focused suite and
    # guards run by the script itself, self-verifies the result, and uploads three files as 14-day workflow artifacts.
    # It creates no tag and no GitHub Release, publishes nothing, and does not commit back (the evidence-log line is an artifact).
    # Hosted CI holds no signing key: the candidate is unsigned (built_by: hosted-ci); a formal release must be re-signed by the
    # key holder on a controlled machine (docs/release/README.md). Not release acceptance and not production acceptance.
    name: Release candidate (unsigned, artifacts only)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # only for `gh run list` (--ci-run=auto) to find a successful ci.yml run for this exact commit
    concurrency:
      group: candidate-${{ github.repository }}
      cancel-in-progress: false
    env:
      GML_VERIFY_PLATFORM: linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare isolated Python verifier and output paths (outside the checkout)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/xlsx-venv"
          "$RUNNER_TEMP/xlsx-venv/bin/pip" install --no-cache-dir --disable-pip-version-check -r requirements-test.txt
          echo "GML_PYTHON=$RUNNER_TEMP/xlsx-venv/bin/python" >> "$GITHUB_ENV"
          echo "CAND_OUT=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "CAND_LOG=$RUNNER_TEMP/evidence-log.jsonl" >> "$GITHUB_ENV"
          echo "CAND_UPLOAD=$RUNNER_TEMP/candidate-upload" >> "$GITHUB_ENV"
          command -v unzip
      - name: Install locked dependencies and selected native build hooks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 esbuild --no-audit --no-fund
      # The log lives in $RUNNER_TEMP, so the checkout stays clean; a seed copy (if the repo has one) lets the chain continue.
      - name: Build candidate (focused suite + guards + acceptance run by the script; unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [ -f docs/release/EVIDENCE-LOG.jsonl ] && cp docs/release/EVIDENCE-LOG.jsonl "$CAND_LOG"
          # The workflow-level GML_RUNTIME_MODE=test / GML_DB='' are for the source-level jobs; the production acceptance step inside
          # the script must start the packaged server in production mode, so they are removed for this command (as for a local run).
          env -u GML_RUNTIME_MODE -u GML_DB node scripts/release-candidate.mjs --run-tests --ci-run=auto --log="$CAND_LOG" --output="$CAND_OUT"
      - name: Self-verify the candidate (extracted package, evidence, archive hash, log chain)
        run: |
          set -euo pipefail
          zip="$(ls "$CAND_OUT"/RC-*.zip)"
          name="$(basename "$zip" .zip)"
          mkdir -p "$RUNNER_TEMP/pkg-x"
          unzip -q "$zip" -d "$RUNNER_TEMP/pkg-x"
          pkg="$(ls -d "$RUNNER_TEMP"/pkg-x/*/)"
          (cd "$pkg" && node scripts/verify-release.mjs --evidence="$CAND_OUT/$name.evidence/EVIDENCE.json" --artifact="$zip" --log="$CAND_LOG")
          mkdir -p "$CAND_UPLOAD"
          cp "$zip" "$CAND_UPLOAD/"
          cp "$CAND_OUT/$name.evidence/EVIDENCE.json" "$CAND_UPLOAD/EVIDENCE.json"
          tail -n 1 "$CAND_LOG" > "$CAND_UPLOAD/evidence-log-line.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-erp-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-upload/RC-*.zip
            ${{ runner.temp }}/candidate-upload/EVIDENCE.json
            ${{ runner.temp }}/candidate-upload/evidence-log-line.jsonl
          if-no-files-found: error
          retention-days: 14
