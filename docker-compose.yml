# ============================================================================
# 文件标识：docker-compose.yml ｜ 本地 / 演示栈（回环发布、只读根文件系统、命名数据卷、密钥只从环境取）
# ============================================================================
# 决策见 docs/implementation/ADR-0012-container-and-version-contract.md；
# 文本规则由 tests/dockerfile-policy.test.mjs 静态守卫。
#
# 启动：
#   cp .env.example .env && 编辑 .env 填入 GML_JWT_SECRET（openssl rand -hex 32）
#   docker compose up --build
# 或不落盘：GML_JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
#
# 本文件**不是**生产编排：生产请用 k8s / 云编排平台显式下发密钥、TLS 与备份策略。
services:
  os-erp:
    build:
      context: .
      args:
        # 构建 SHA 注入 /api、/api/meta/health、AI manifest、MCP serverInfo 的 build_sha（可空）
        GML_BUILD_SHA: ${GML_BUILD_SHA:-}
    image: os-erp:local
    container_name: os-erp
    restart: unless-stopped
    # 默认只发布到本机回环：对外提供服务请放在反向代理 / TLS 终结之后，不要改成 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      # 可选：从 .env 读取（见 .env.example）；没有该文件时不报错
      - path: .env
        required: false
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      GML_RUNTIME_MODE: production
      GML_DATA_DIR: /data
      # 密钥**必须显式提供**：用 `:?` 而不是 `:-默认值` —— 缺变量时 compose 自己拒绝解析，
      # 报出来的那句话本身就是修复命令。任何写进仓库的默认密钥都是公开已知值，等于没有认证。
      # 第二道闸门在程序侧：变量给了但等于公开已知值 ⇒ production 下拒绝启动
      # （见 server/middleware/auth.js 的 PUBLIC_DEFAULT_SECRETS）。
      # 受信反向代理（ADR-0040）：默认 off —— X-Forwarded-For / -Proto / X-Request-Id 一律忽略。
      # 在容器前加 HTTPS 反向代理时才设置，值 = 代理在容器内看到的**连接来源地址**（不是公网地址），例如
      #   GML_TRUST_PROXY: 172.18.0.0/16     # compose 默认网桥网段，用 `docker network inspect` 核对
      # 取值：off | loopback | 逗号分隔的 IPv4/IPv6 CIDR；非法值启动即失败（TRUST_PROXY_INVALID）。
      # 注意：本文件把端口只发布到宿主机 127.0.0.1，容器内看到的对端是网桥网关而不是 127.0.0.1，`loopback` 在此无效。
      # 代理必须**覆盖**（而非透传）X-Forwarded-For / -Proto / X-Request-Id，见安装手册 6.1。
      GML_TRUST_PROXY: ${GML_TRUST_PROXY:-off}
      GML_JWT_SECRET: ${GML_JWT_SECRET:?GML_JWT_SECRET 必须显式提供 —— 生成并启动：GML_JWT_SECRET=$(openssl rand -hex 32) docker compose up}
    # 根文件系统只读：程序只写 GML_DATA_DIR（/data，命名卷）；/tmp 给 tmpfs 以防库或运行时需要临时文件
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - os-erp-data:/data

volumes:
  os-erp-data:
